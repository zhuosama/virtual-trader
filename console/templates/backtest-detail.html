<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backtest Result · Hermes Console</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #1a1d2e; --border: #2a2d3e;
    --ink: #e8e9ed; --muted: #6b7089; --accent: #4f8ff7;
    --positive: #326d36; --negative: #c0392b;
    --mono: 'SF Mono','Cascadia Code','Consolas', monospace;
    --sans: -apple-system,'Segoe UI', system-ui, sans-serif;
  }
  body { font-family: var(--sans); background: var(--bg); color: var(--ink); line-height: 1.6; min-height: 100vh; }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 2rem; border-bottom: 1px solid var(--border); background: var(--surface); }
  .header h1 { font-size: 1rem; font-weight: 600; }
  .header nav a { color: var(--muted); text-decoration: none; font-size: .8rem; margin-left: 1.5rem; transition: color .14s; }
  .header nav a:hover { color: var(--ink); }
  .main { max-width: 1200px; margin: 0 auto; padding: 2rem; }
  .back-link { display: inline-flex; align-items: center; gap: .5rem; color: var(--accent); text-decoration: none; font-size: .85rem; margin-bottom: 1.5rem; }
  .back-link:hover { text-decoration: underline; }
  .section-title { font-family: var(--mono); font-size: .7rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 2rem 0 1rem; }
  .section-title:first-of-type { margin-top: 0; }
  .privacy-banner { padding: .5rem .75rem; margin-bottom: 1.5rem; border: 1px solid var(--negative); border-radius: 4px; color: var(--negative); font-size: .75rem; font-family: var(--mono); }

  /* Metric cards */
  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: .75rem; margin-bottom: 2rem; }
  .metric-card { padding: .75rem; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); }
  .metric-card .label { font-family: var(--mono); font-size: .6rem; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .metric-card .value { font-family: var(--mono); font-size: 1.25rem; font-weight: 700; margin-top: .25rem; }
  .positive { color: var(--positive); }
  .negative { color: var(--negative); }

  /* Charts */
  .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(500px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
  .chart-card { border: 1px solid var(--border); border-radius: 6px; background: var(--surface); padding: 1rem; overflow: hidden; }
  .chart-title { font-family: var(--mono); font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: .75rem; }
  .chart-container { position: relative; width: 100%; }
  .chart-container svg { width: 100%; height: auto; display: block; }

  /* Tooltip */
  .tooltip { position: fixed; padding: .5rem .75rem; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; font-family: var(--mono); font-size: .75rem; pointer-events: none; z-index: 100; display: none; box-shadow: 0 4px 12px rgba(0,0,0,.3); }

  /* Trade table */
  .trades-table { width: 100%; border-collapse: collapse; font-size: .8rem; }
  .trades-table th { font-family: var(--mono); font-size: .65rem; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); text-align: left; padding: .5rem; border-bottom: 1px solid var(--border); font-weight: 600; }
  .trades-table td { padding: .5rem; border-bottom: 1px solid var(--border); font-family: var(--mono); font-size: .8rem; }
  .trades-table .num { text-align: right; }
  .trades-table tr:hover td { background: rgba(79,143,247,.04); }

  .error-box { padding: 1rem; border: 1px solid var(--negative); border-radius: 6px; color: var(--negative); margin-bottom: 2rem; }
  .empty-state { color: var(--muted); font-size: .85rem; padding: 2rem; text-align: center; border: 1px dashed var(--border); border-radius: 6px; }
  .footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--border); font-family: var(--mono); font-size: .7rem; color: var(--muted); text-align: center; }
</style>
</head>
<body>

<div class="header">
  <h1>Hermes Console · Backtest Result</h1>
  <nav>
    <a href="/console/virtual-trader">Home</a>
    <a href="/console/virtual-trader/data">Data</a>
    <a href="/console/virtual-trader/strategies">Strategies</a>
    <a href="/console/virtual-trader/backtests">Backtests</a>
  </nav>
</div>

<div class="main">
  <a class="back-link" href="/console/virtual-trader/backtests">← Back to Backtests</a>
  <div class="privacy-banner">⚠ Local private detail — never exported publicly</div>

  <div id="content"></div>
  <div class="footer">Backtest Result Viewer · 127.0.0.1 only · privateOnly</div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
(function() {
  var run = __RUN_JSON__;
  var container = document.getElementById('content');

  if (run.status === 'failed') {
    container.innerHTML = '<div class="error-box"><strong>Run Failed</strong><br>' + escapeHtml(run.error || 'Unknown error') + '</div>';
    return;
  }

  if (!run.dailySeries || run.dailySeries.length === 0) {
    container.innerHTML = '<div class="empty-state">No daily series data available for this run.</div>';
    return;
  }

  var ds = run.dailySeries;

  // --- Metric Cards ---
  var metricsHtml = '<div class="metrics-grid">' +
    metricCard('Status', run.status, '') +
    metricCard('Strategy', run.strategyId, '') +
    metricCard('Period', run.startDate + ' → ' + run.endDate, '') +
    metricCard('Return', fmtPct(run.cumulativeReturnPct), run.cumulativeReturnPct >= 0 ? 'positive' : 'negative') +
    metricCard('Benchmark', fmtPct(run.benchmarkReturnPct), run.benchmarkReturnPct >= 0 ? 'positive' : 'negative') +
    metricCard('Excess', fmtPct(run.excessReturnPct), run.excessReturnPct >= 0 ? 'positive' : 'negative') +
    metricCard('Max Drawdown', fmtPct(run.maxDrawdownPct), 'negative') +
    metricCard('Win Rate', run.winRatePct != null ? run.winRatePct.toFixed(0) + '%' : '—', '') +
    metricCard('Trades', run.tradeCount, '') +
    metricCard('Sharpe', run.sharpeRatio != null ? run.sharpeRatio.toFixed(2) : '—', '') +
  '</div>';

  // --- Charts ---
  var chartsHtml = '<div class="chart-grid">' +
    chartCard('Cumulative Return', renderCumulativeChart(ds, run)) +
    chartCard('Daily Return', renderDailyReturnChart(ds)) +
    chartCard('Drawdown', renderDrawdownChart(ds)) +
    chartCard('Position Count', renderPositionChart(ds)) +
  '</div>';

  // --- Trades ---
  var tradesHtml = '';
  if (run.tradeSummary && run.tradeSummary.length > 0) {
    tradesHtml = '<div class="section-title">Trade Summary (private-only)</div>' +
      '<table class="trades-table"><thead><tr>' +
      '<th>Date</th><th>Code</th><th>Name</th><th>Shares</th><th>Cost</th><th>Sell</th><th>P&L</th>' +
      '</tr></thead><tbody>' +
      run.tradeSummary.map(function(t) {
        var cls = t.pnl >= 0 ? 'positive' : 'negative';
        return '<tr><td>' + t.date + '</td><td>' + t.code + '</td><td>' + t.name + '</td>' +
          '<td class="num">' + t.shares + '</td><td class="num">' + t.cost.toFixed(2) + '</td>' +
          '<td class="num">' + t.sellPrice.toFixed(2) + '</td>' +
          '<td class="num ' + cls + '">' + (t.pnl >= 0 ? '+' : '') + t.pnl.toFixed(2) + '</td></tr>';
      }).join('') +
      '</tbody></table>';
  }

  container.innerHTML = metricsHtml + chartsHtml + tradesHtml;

  // --- Tooltip logic ---
  var tooltip = document.getElementById('tooltip');
  document.addEventListener('mousemove', function(e) {
    if (tooltip.style.display === 'block') {
      tooltip.style.left = (e.clientX + 12) + 'px';
      tooltip.style.top = (e.clientY - 10) + 'px';
    }
  });

  function showTooltip(html) {
    tooltip.innerHTML = html;
    tooltip.style.display = 'block';
  }

  function hideTooltip() {
    tooltip.style.display = 'none';
  }

  // --- Chart rendering functions ---
  function renderCumulativeChart(ds, run) {
    var w = 600, h = 200, pad = {t:20,r:20,b:30,l:50};
    var cw = w - pad.l - pad.r, ch = h - pad.t - pad.b;

    // Compute cumulative returns (normalize to initial capital)
    var initialCap = run.initialCapital || ds[0].totalValue;
    var strategyLine = ds.map(function(d,i) {
      return {x: i, y: ((d.totalValue / initialCap) - 1) * 100, date: d.date};
    });

    // Benchmark: hs300ReturnPct is already cumulative from start
    var benchLine = ds.map(function(d,i) {
      return {x: i, y: d.hs300ReturnPct || 0, date: d.date};
    });

    var allY = strategyLine.concat(benchLine).map(function(p){return p.y;});
    var yMin = Math.min.apply(null, allY), yMax = Math.max.apply(null, allY);
    var yPad = (yMax - yMin) * 0.1 || 1;
    yMin -= yPad; yMax += yPad;

    function sx(i) { return pad.l + (i / (ds.length - 1)) * cw; }
    function sy(v) { return pad.t + (1 - (v - yMin) / (yMax - yMin)) * ch; }

    var stratPath = strategyLine.map(function(p,i) { return (i===0?'M':'L') + sx(p.x).toFixed(1) + ',' + sy(p.y).toFixed(1); }).join(' ');
    var benchPath = benchLine.map(function(p,i) { return (i===0?'M':'L') + sx(p.x).toFixed(1) + ',' + sy(p.y).toFixed(1); }).join(' ');

    // Zero line
    var zeroY = sy(0);

    var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '">' +
      '<line x1="'+pad.l+'" y1="'+zeroY+'" x2="'+(w-pad.r)+'" y2="'+zeroY+'" stroke="'+clr('--border')+'" stroke-width="1" stroke-dasharray="4"/>' +
      '<path d="'+benchPath+'" fill="none" stroke="'+clr('--muted')+'" stroke-width="1.5" opacity="0.6"/>' +
      '<path d="'+stratPath+'" fill="none" stroke="'+clr('--accent')+'" stroke-width="2"/>' +
      axisLabels(ds, w, h, pad) +
      yLabels(yMin, yMax, w, h, pad, '%');

    // Hover zones
    ds.forEach(function(d,i) {
      var x = sx(i), bw = cw / ds.length;
      var excess = strategyLine[i].y - benchLine[i].y;
      svg += '<rect x="'+(x-bw/2)+'" y="'+pad.t+'" width="'+bw+'" height="'+ch+'" fill="transparent" ' +
        'onmousemove="showTooltip(\''+d.date+'<br>Strategy: '+fmtPct(strategyLine[i].y)+'<br>Benchmark: '+fmtPct(benchLine[i].y)+'<br>Excess: '+fmtPct(excess)+'\')" onmouseout="hideTooltip()"/>';
    });

    svg += '</svg>';
    return svg;
  }

  function renderDailyReturnChart(ds) {
    var w = 600, h = 180, pad = {t:10,r:20,b:30,l:50};
    var cw = w - pad.l - pad.r, ch = h - pad.t - pad.b;
    var barW = Math.max(2, (cw / ds.length) - 1);

    var vals = ds.map(function(d){return d.dailyReturnPct;});
    var yMin = Math.min.apply(null, vals), yMax = Math.max.apply(null, vals);
    var yPad = (yMax - yMin) * 0.15 || 0.5;
    yMin -= yPad; yMax += yPad;

    function sx(i) { return pad.l + (i + 0.5) / ds.length * cw; }
    function sy(v) { return pad.t + (1 - (v - yMin) / (yMax - yMin)) * ch; }

    var zeroY = sy(0);
    var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '">' +
      '<line x1="'+pad.l+'" y1="'+zeroY+'" x2="'+(w-pad.r)+'" y2="'+zeroY+'" stroke="'+clr('--border')+'" stroke-width="1"/>';

    ds.forEach(function(d,i) {
      var x = sx(i) - barW/2, y = sy(d.dailyReturnPct);
      var barH = Math.abs(y - zeroY);
      var barY = d.dailyReturnPct >= 0 ? y : zeroY;
      var color = d.dailyReturnPct >= 0 ? clr('--positive') : clr('--negative');
      svg += '<rect x="'+x.toFixed(1)+'" y="'+barY.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+barH.toFixed(1)+'" fill="'+color+'" opacity="0.8" ' +
        'onmousemove="showTooltip(\''+d.date+'<br>Return: '+(d.dailyReturnPct>=0?'+':'')+d.dailyReturnPct.toFixed(2)+'%\')" onmouseout="hideTooltip()"/>';
    });

    svg += axisLabels(ds, w, h, pad) + yLabels(yMin, yMax, w, h, pad, '%') + '</svg>';
    return svg;
  }

  function renderDrawdownChart(ds) {
    var w = 600, h = 160, pad = {t:10,r:20,b:30,l:50};
    var cw = w - pad.l - pad.r, ch = h - pad.t - pad.b;

    // Compute drawdown
    var peak = ds[0].totalValue;
    var dd = ds.map(function(d,i) {
      if (d.totalValue > peak) peak = d.totalValue;
      var pct = ((d.totalValue - peak) / peak) * 100;
      return {x: i, y: pct, date: d.date};
    });

    var yMin = Math.min.apply(null, dd.map(function(d){return d.y;})) * 1.1;
    var yMax = 0;

    function sx(i) { return pad.l + (i / (ds.length - 1)) * cw; }
    function sy(v) { return pad.t + (1 - (v - yMin) / (yMax - yMin)) * ch; }

    var areaPath = 'M' + sx(0).toFixed(1) + ',' + sy(0).toFixed(1) + ' ' +
      dd.map(function(d,i) { return 'L' + sx(d.x).toFixed(1) + ',' + sy(d.y).toFixed(1); }).join(' ') +
      ' L' + sx(dd.length-1).toFixed(1) + ',' + sy(0).toFixed(1) + ' Z';

    var linePath = dd.map(function(d,i) { return (i===0?'M':'L') + sx(d.x).toFixed(1) + ',' + sy(d.y).toFixed(1); }).join(' ');

    // Find max drawdown point
    var maxDd = dd.reduce(function(a,b) { return a.y < b.y ? a : b; });

    var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '">' +
      '<path d="'+areaPath+'" fill="'+clr('--negative')+'" opacity="0.15"/>' +
      '<path d="'+linePath+'" fill="none" stroke="'+clr('--negative')+'" stroke-width="1.5"/>' +
      '<circle cx="'+sx(maxDd.x).toFixed(1)+'" cy="'+sy(maxDd.y).toFixed(1)+'" r="4" fill="'+clr('--negative')+'"/>' +
      '<text x="'+sx(maxDd.x).toFixed(1)+'" y="'+(sy(maxDd.y)-8).toFixed(1)+'" text-anchor="middle" fill="'+clr('--negative')+'" font-size="10" font-family="var(--mono)">'+maxDd.y.toFixed(2)+'%</text>' +
      axisLabels(ds, w, h, pad) + yLabels(yMin, yMax, w, h, pad, '%');

    ds.forEach(function(d,i) {
      var x = sx(i), bw = cw / ds.length;
      svg += '<rect x="'+(x-bw/2)+'" y="'+pad.t+'" width="'+bw+'" height="'+ch+'" fill="transparent" ' +
        'onmousemove="showTooltip(\''+dd[i].date+'<br>Drawdown: '+dd[i].y.toFixed(2)+'%\')" onmouseout="hideTooltip()"/>';
    });

    svg += '</svg>';
    return svg;
  }

  function renderPositionChart(ds) {
    var w = 600, h = 140, pad = {t:10,r:20,b:30,l:50};
    var cw = w - pad.l - pad.r, ch = h - pad.t - pad.b;

    var vals = ds.map(function(d){return d.positionCount;});
    var yMin = 0, yMax = Math.max.apply(null, vals) + 1;

    function sx(i) { return pad.l + (i / (ds.length - 1)) * cw; }
    function sy(v) { return pad.t + (1 - (v - yMin) / (yMax - yMin)) * ch; }

    var areaPath = 'M' + sx(0).toFixed(1) + ',' + sy(0).toFixed(1) + ' ' +
      ds.map(function(d,i) { return 'L' + sx(i).toFixed(1) + ',' + sy(d.positionCount).toFixed(1); }).join(' ') +
      ' L' + sx(ds.length-1).toFixed(1) + ',' + sy(0).toFixed(1) + ' Z';

    var linePath = ds.map(function(d,i) { return (i===0?'M':'L') + sx(i).toFixed(1) + ',' + sy(d.positionCount).toFixed(1); }).join(' ');

    var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '">' +
      '<path d="'+areaPath+'" fill="'+clr('--accent')+'" opacity="0.1"/>' +
      '<path d="'+linePath+'" fill="none" stroke="'+clr('--accent')+'" stroke-width="1.5"/>' +
      axisLabels(ds, w, h, pad) + yLabelsInt(yMin, yMax, w, h, pad);

    ds.forEach(function(d,i) {
      var x = sx(i), bw = cw / ds.length;
      svg += '<rect x="'+(x-bw/2)+'" y="'+pad.t+'" width="'+bw+'" height="'+ch+'" fill="transparent" ' +
        'onmousemove="showTooltip(\''+d.date+'<br>Positions: '+d.positionCount+'\')" onmouseout="hideTooltip()"/>';
    });

    svg += '</svg>';
    return svg;
  }

  // --- Helpers ---
  function clr(varName) {
    return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
  }

  function metricCard(label, value, cls) {
    return '<div class="metric-card"><div class="label">' + label + '</div><div class="value ' + cls + '">' + (value != null ? value : '—') + '</div></div>';
  }

  function chartCard(title, svg) {
    return '<div class="chart-card"><div class="chart-title">' + title + '</div><div class="chart-container">' + svg + '</div></div>';
  }

  function fmtPct(v) {
    if (v == null) return '—';
    return (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
  }

  function axisLabels(ds, w, h, pad) {
    var cw = w - pad.l - pad.r;
    var labels = '';
    var step = Math.max(1, Math.floor(ds.length / 6));
    for (var i = 0; i < ds.length; i += step) {
      var x = pad.l + (i / (ds.length - 1)) * cw;
      labels += '<text x="'+x.toFixed(1)+'" y="'+(h - 5)+'" text-anchor="middle" fill="'+clr('--muted')+'" font-size="9" font-family="var(--mono)">'+ds[i].date.slice(5)+'</text>';
    }
    return labels;
  }

  function yLabels(yMin, yMax, w, h, pad, unit) {
    var labels = '';
    var steps = 4;
    for (var i = 0; i <= steps; i++) {
      var v = yMin + (yMax - yMin) * i / steps;
      var y = pad.t + (1 - i / steps) * (h - pad.t - pad.b);
      labels += '<text x="'+(pad.l - 5)+'" y="'+(y + 3).toFixed(1)+'" text-anchor="end" fill="'+clr('--muted')+'" font-size="9" font-family="var(--mono)">'+v.toFixed(1)+unit+'</text>';
    }
    return labels;
  }

  function yLabelsInt(yMin, yMax, w, h, pad) {
    var labels = '';
    var steps = Math.min(4, Math.floor(yMax));
    for (var i = 0; i <= steps; i++) {
      var v = yMin + (yMax - yMin) * i / steps;
      var y = h - pad.b - (i / steps) * (h - pad.t - pad.b);
      labels += '<text x="'+(pad.l - 5)+'" y="'+(y + 3).toFixed(1)+'" text-anchor="end" fill="'+clr('--muted')+'" font-size="9" font-family="var(--mono)">'+Math.round(v)+'</text>';
    }
    return labels;
  }

  function escapeHtml(s) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(s));
    return div.innerHTML;
  }
})();
</script>

</body>
</html>
